name: PR auto-merge (green CI)
# Repository rule: if a PR passes CI, merge it. Calls the shared merge helper after
# CI completes on a same-repo pull request; the helper re-checks reviews, holds
# (draft, requested review, unresolved threads, changes requested), and that every
# check on the exact head is green before squash-merging. GitHub-hosted runner (public repo).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: read
jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    uses: Oceanswave/github-workflows/.github/workflows/merge.yml@125b14d3312b525c8f5b42e9f1c7a9e172d1b23f # main
    with:
      runs-on: '["ubuntu-latest"]'
      head-branch: ${{ github.event.workflow_run.head_branch }}
      expected-head: ${{ github.event.workflow_run.head_sha }}
      required-checks: '[{"name":"verify","appId":15368},{"name":"secret-scan","appId":15368},{"name":"go-conformance","appId":15368},{"name":"deploy-dry-run / Wrangler deploy","appId":15368}]'
